[project]
name = "workbench"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Abdullah", email = "abdullahatiff04@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "anthropic>=2.14.0",
    "mcp[cli]>=2.3.0",
    "python-dotenv>=1.2.4",
]

[project.scripts]
workbench = "workbench:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
